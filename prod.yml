# Боевой конфиг Nakama. Секреты (ключи, пароли) и CTG_DEBUG приходят флагами запуска из .env —
# см. docker-compose.prod.yml и deploy/setup.sh. Здесь — только то, что не секрет.
name: ctg-proto
console:
  max_message_size_bytes: 409600
logger:
  level: 'info'
runtime:
  js_entrypoint: 'main.js'
session:
  token_expiry_sec: 7200
socket:
  max_message_size_bytes: 4096
  max_request_size_bytes: 262144
