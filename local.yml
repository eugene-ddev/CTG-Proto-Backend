name: ctg-proto
console:
  max_message_size_bytes: 409600
logger:
  level: 'debug'
runtime:
  js_entrypoint: 'main.js'
  # режим отладки: сервер исполняет debug-действия (кубы, предметы, лечение) и player/reset. В проде — убрать.
  env:
    - 'CTG_DEBUG=true'
session:
  token_expiry_sec: 7200
socket:
  max_message_size_bytes: 4096
  max_request_size_bytes: 262144
