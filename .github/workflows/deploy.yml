# Push в main → проверка → выкладка на сервер (deploy/pull.sh по SSH: git pull обоих репозиториев и пересборка).
# Настройки сервера — окружение production: секреты SSH_* и CONSOLE_PASSWORD, переменные DOMAIN, GAME_PATH, CTG_DEBUG,
# CONSOLE_USER (завести всё — deploy/github-env.sh). Незаданные значения сервер оставляет свои.
# Пока окружение не настроено, выкладка пропускается.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Окружение не настроено
        if: env.SSH_HOST == ''
        run: echo "::notice::Нет секрета SSH_HOST в окружении production — выкладка пропущена (deploy/github-env.sh)"

      - name: Выкладка
        if: env.SSH_HOST != ''
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          GAME_PATH: ${{ vars.GAME_PATH }}
          CTG_DEBUG: ${{ vars.CTG_DEBUG }}
          CONSOLE_USER: ${{ vars.CONSOLE_USER }}
          CONSOLE_PASSWORD: ${{ secrets.CONSOLE_PASSWORD }}
          CONSOLE_SIGNING_KEY: ${{ secrets.CONSOLE_SIGNING_KEY }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          HTTP_KEY: ${{ secrets.HTTP_KEY }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          REFRESH_KEY: ${{ secrets.REFRESH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ctg.env
          for key in DOMAIN GAME_PATH CTG_DEBUG CONSOLE_USER CONSOLE_PASSWORD CONSOLE_SIGNING_KEY SERVER_KEY HTTP_KEY SESSION_KEY REFRESH_KEY; do
            if [ -n "${!key}" ]; then printf '%s=%s\n' "$key" "${!key}" >> ctg.env; fi
          done
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            -p "${SSH_PORT:-22}" "${SSH_USER:-root}@$SSH_HOST" deploy < ctg.env
          rm -f ctg.env ~/.ssh/deploy_key
