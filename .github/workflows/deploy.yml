# Push в main → проверка → выкладка на сервер (deploy/pull.sh по SSH: git pull обоих репозиториев и пересборка).
# Настройки сервера — окружение production: секреты и переменные (список — README, «Настройки — в GitHub»;
# завести — deploy/github-env.sh). Передаются все, сервер берёт известные; незаданные оставляет свои.
# Пока окружение не настроено, выкладка пропускается.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Окружение не настроено
        if: env.SSH_HOST == ''
        run: echo "::notice::Нет секрета SSH_HOST в окружении production — выкладка пропущена (deploy/github-env.sh)"

      - name: Выкладка
        if: env.SSH_HOST != ''
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # все переменные и секреты окружения, кроме доступа к серверу; сервер берёт только те, что знает
          # (deploy/lib.sh → GITHUB_ENV_KEYS) — новая настройка сервера не требует правок этого файла
          jq -rn --argjson v "$ALL_VARS" --argjson s "$ALL_SECRETS" '
            $v + $s | to_entries[]
            | select(.key | test("^(SSH_|GITHUB_|github_token$)") | not)
            | select((.value | type) == "string" and (.value | test("\n") | not))
            | "\(.key)=\(.value)"' > ctg.env
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            -p "${SSH_PORT:-22}" "${SSH_USER:-root}@$SSH_HOST" deploy < ctg.env
          rm -f ctg.env ~/.ssh/deploy_key
